# release-attach.yml — SLSA provenance attest（STEP45B 修正版）
# 仅 workflow_dispatch 人工触发；只 attest 不上传、不 push、不 create release、不自动打 tag。
# 修正点：subject-path 不再使用裸 inputs.zip（Windows 风格相对路径在 ubuntu runner 解析失败），
# 改为 runner 用 git archive 自重建归档 → sha256 门禁校验 → 以 ${{ github.workspace }}/${{ inputs.zip }} 绝对路径 attest。
name: release-attach-draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '已发布 tag（如 v0.4.6）'
        required: true
        default: 'v0.4.6'
      zip:
        description: '归档 zip 的仓库内相对路径'
        required: true
        default: 'BASE/regression-runs/provenance-v0.4.6/agent-os-base-v0.4.6.zip'

permissions:
  id-token: write
  contents: read
  attestations: write

jobs:
  attach-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}
      - name: Recreate archive from tag
        run: |
          mkdir -p "$(dirname "${{ inputs.zip }}")"
          git archive "${{ inputs.tag }}" -o "${{ inputs.zip }}"
      - name: Verify sha256 gate
        run: |
          echo "910ab74b736f54c683c8ec03fcbcd2dacad63582304ed1366e351ca6b8b3b00a  ${{ inputs.zip }}" > expected.sha256
          sha256sum -c expected.sha256 || exit 1
      - name: Generate SLSA provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ github.workspace }}/${{ inputs.zip }}
      - name: Print verify hints (read-only)
        run: |
          echo "本地验证命令（只读）："
          echo "  gh attestation list --repo bobbyliuzh06/agent-os-base --limit 50"
          echo "  gh attestation verify '${{ inputs.zip }}' --repo bobbyliuzh06/agent-os-base --signer-workflow bobbyliuzh06/agent-os-base/.github/workflows/release-attach.yml"
          echo "  gh release verify-asset '${{ inputs.tag }}' '${{ inputs.zip }}' --repo bobbyliuzh06/agent-os-base"

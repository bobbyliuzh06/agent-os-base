# release-attach.yml — SLSA provenance attest（STEP45C 修正版：attest 已发布资产本体）
# 仅 workflow_dispatch 人工触发；只 attest，不做任何写入远端（无 push/create/release/upload/delete/tag）。
# 修正：attest 对象由"runner git archive 重建"改为"gh release download 下载已发布 Release 资产本体"，
# 消除 git archive 在不同平台字节不确定导致的 sha256 门禁误杀。
name: release-attach-draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '已发布 tag'
        required: true
        default: 'v0.5.0'
      asset:
        description: '已发布资产文件名'
        required: true
        default: 'agent-os-base-v0.5.0.zip'

permissions:
  id-token: write
  contents: read
  attestations: write

jobs:
  attach-provenance:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ASSET_PATH: ${{ github.workspace }}/attest-work/${{ inputs.asset }}
    steps:
      - name: Download published release asset
        run: |
          mkdir -p attest-work
          gh release download "${{ inputs.tag }}" --repo bobbyliuzh06/agent-os-base --pattern "${{ inputs.asset }}" --dir attest-work
      - name: Verify sha256 gate
        run: |
          EXPECTED="33df73210072674ec812259ea456e8924c47218f85bc25139c318e1b315942dc"
          ACTUAL="$(sha256sum "${{ env.ASSET_PATH }}" | awk '{print $1}')"
          echo "ACTUAL=$ACTUAL"
          echo "EXPECTED=$EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then echo "SHA256_MISMATCH"; exit 1; fi
          echo "SHA256_OK"
      - name: Generate SLSA provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ env.ASSET_PATH }}
      - name: Print verify hints
        run: |
          echo "本地验证命令（只读）："
          echo "  gh attestation list --repo bobbyliuzh06/agent-os-base --limit 50"
          echo "  gh attestation verify <local-copy-of-asset> --repo bobbyliuzh06/agent-os-base --signer-workflow bobbyliuzh06/agent-os-base/.github/workflows/release-attach.yml"
          echo "  gh release verify-asset ${{ inputs.tag }} <local-copy-of-asset> --repo bobbyliuzh06/agent-os-base"

# release-attach.yml — 供应链验证草案（STEP42B）
# 仅 workflow_dispatch 手动触发；不 push、不 create release、不自动打 tag。
# 用途：对指定 tag 的 zip 资产生成 build provenance attestation 并上传 attestation 文件
# （供 gh release verify / gh attestation verify 使用）。
# 注意：本文件当前为本地草案，未启用 secrets、未触发；启用前需人工复核。
name: release-attach-draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '已发布 tag（如 v0.4.6）'
        required: true
      zip_path:
        description: '归档 zip 的仓库内相对路径'
        required: true
        default: 'BASE/regression-runs/agent-os-base.zip'

permissions:
  id-token: write
  contents: read
  attestations: write

jobs:
  attach-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ github.event.inputs.zip_path }}
      # 以下仅为打印说明，不做任何写操作
      - name: Print verify hints
        run: |
          echo "本地验证（只读）："
          echo "  gh release verify '${{ github.event.inputs.tag }}' -R <owner>/<repo>"
          echo "  gh release verify-asset '${{ github.event.inputs.tag }}' <local-zip> -R <owner>/<repo>"
